name: Latest blog
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://bohuyeshan.top/rss.xml'
          max_post_count: '5'
          comment_tag_name: 'BLOG-POST-LIST'
